name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ docker_ci ]
  pull_request:
    branches: [ docker_ci ]

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run training script
      run: |
        python src/train.py
    
    - name: Verify model files exist
      run: |
        ls -la models/
        test -f models/linear_regression_model.joblib
        test -f models/test_data.joblib
    
    - name: Build Docker image
      run: |
        docker build -t mlops-assignment:latest .
    
    - name: Run Docker container verification
      run: |
        docker run --rm mlops-assignment:latest python src/predict.py
    
    - name: Log in to Docker Hub
      if: success()
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Push Docker image to Docker Hub
      if: success()
      run: |
        docker tag mlops-assignment:latest ${{ secrets.DOCKER_USERNAME }}/mlops-assignment:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/mlops-assignment:latest
    
    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-models
        path: models/